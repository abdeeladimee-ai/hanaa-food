name: Set Hanaa Food opening hours

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-opening-hours.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-hours:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update opening hours safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')
          original = text

          if 'const HANAA_OPEN_MINUTES = 12 * 60;' not in text:
              anchor = 'const routingEndpoint = "https://router.project-osrm.org/route/v1/driving";'
              if anchor not in text:
                  raise SystemExit('Safety check failed: routing anchor not found.')
              helper_lines = [
                  'const HANAA_OPEN_MINUTES = 12 * 60;',
                  'const HANAA_CLOSE_MINUTES = 3 * 60;',
                  'const HANAA_HOURS_LABEL = "12:00 – 03:00";',
                  'function casablancaMinutesNow() {',
                  '  const parts = new Intl.DateTimeFormat("en-GB", {',
                  '    timeZone: "Africa/Casablanca",',
                  '    hour: "2-digit",',
                  '    minute: "2-digit",',
                  '    hourCycle: "h23",',
                  '  }).formatToParts(new Date());',
                  '  const hour = Number(parts.find((part) => part.type === "hour")?.value || 0);',
                  '  const minute = Number(parts.find((part) => part.type === "minute")?.value || 0);',
                  '  return hour * 60 + minute;',
                  '}',
                  'function isHanaaOpenNow() {',
                  '  const minutes = casablancaMinutesNow();',
                  '  return minutes >= HANAA_OPEN_MINUTES || minutes < HANAA_CLOSE_MINUTES;',
                  '}',
                  '',
              ]
              helper = '\n'.join(helper_lines) + '\n'
              text = text.replace(anchor, helper + anchor, 1)

          guard_marker = 'Hanaa Food est fermé. Horaires: 12:00 – 03:00.'
          if guard_marker not in text:
              place_marker = 'const place = async (details) => {'
              if text.count(place_marker) != 1:
                  raise SystemExit(f'Safety check failed: expected one order placement handler, found {text.count(place_marker)}.')
              place_idx = text.find(place_marker)
              insert_at = place_idx + len(place_marker)
              guard_lines = [
                  '',
                  '    if (!isHanaaOpenNow()) {',
                  '      window.alert("Hanaa Food est fermé. Horaires: 12:00 – 03:00.");',
                  '      return;',
                  '    }',
                  '    if (branch && branch.isOpen === false) {',
                  '      window.alert("Ce point de vente est fermé pour le moment.");',
                  '      return;',
                  '    }',
              ]
              text = text[:insert_at] + '\n'.join(guard_lines) + text[insert_at:]

          banner_marker = 'Horaires : {HANAA_HOURS_LABEL}'
          if banner_marker not in text:
              home_start = text.find('function Home({')
              if home_start == -1:
                  raise SystemExit('Safety check failed: Home component not found.')
              home_return = text.find('return (', home_start)
              main_start = text.find('<main', home_return)
              if home_return == -1 or main_start == -1:
                  raise SystemExit('Safety check failed: Home main element not found.')
              main_end = text.find('>', main_start)
              if main_end == -1:
                  raise SystemExit('Safety check failed: Home main opening tag incomplete.')
              main_end += 1
              banner_lines = [
                  '',
                  '      <div',
                  '        style={{',
                  '          margin: "10px 16px 12px",',
                  '          padding: "10px 14px",',
                  '          borderRadius: 14,',
                  '          background: isHanaaOpenNow() ? "#ecfdf3" : "#fff1f2",',
                  '          border: isHanaaOpenNow() ? "1px solid #bbf7d0" : "1px solid #fecdd3",',
                  '          color: "#18181b",',
                  '          fontWeight: 800,',
                  '          fontSize: 14,',
                  '          textAlign: "center",',
                  '        }}',
                  '      >',
                  '        {isHanaaOpenNow() ? "🟢 Ouvert" : "🔴 Fermé"} · Horaires : {HANAA_HOURS_LABEL}',
                  '      </div>',
              ]
              text = text[:main_end] + '\n'.join(banner_lines) + text[main_end:]

          if text != original:
              path.write_text(text, encoding='utf-8')
              print('Configured opening hours 12:00–03:00 Casablanca time.')
          else:
              print('Opening hours already configured.')
          PY

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo 'No source change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git commit -m 'Set opening hours 12:00 to 03:00'
          git push origin HEAD:main
