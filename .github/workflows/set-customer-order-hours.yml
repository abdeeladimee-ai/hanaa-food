name: Set customer order hours

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-customer-order-hours.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Block customer orders from 03:00 to 12:00 Casablanca
        run: |
          python3 - <<'PY'
          from pathlib import Path

          orders_path = Path('src/ordersApi.js')
          text = orders_path.read_text(encoding='utf-8')

          old = '''function hasStaffSession() {
            if (typeof window === "undefined") return false;

            try {
              const session = JSON.parse(sessionStorage.getItem(STAFF_SESSION_KEY) || "null");
              const role = String(session?.role || "").trim().toUpperCase();
              return ["ADMIN", "SNACK", "LIVREUR"].includes(role);
            } catch {
              return false;
            }
          }
          '''
          new = old + '''\nconst CUSTOMER_ORDER_TIME_ZONE = "Africa/Casablanca";
          const CUSTOMER_ORDER_OPEN_HOUR = 12;
          const CUSTOMER_ORDER_CLOSE_HOUR = 3;

          function getCustomerOrderHour(now = new Date()) {
            const part = new Intl.DateTimeFormat("en-GB", {
              timeZone: CUSTOMER_ORDER_TIME_ZONE,
              hour: "2-digit",
              hourCycle: "h23",
            })
              .formatToParts(now)
              .find((item) => item.type === "hour");

            return Number(part?.value);
          }

          function assertCustomerOrderingOpen() {
            if (hasStaffSession()) return;

            const hour = getCustomerOrderHour();
            if (
              Number.isFinite(hour) &&
              hour >= CUSTOMER_ORDER_CLOSE_HOUR &&
              hour < CUSTOMER_ORDER_OPEN_HOUR
            ) {
              const error = new Error("CUSTOMER_ORDERING_CLOSED");
              error.code = "CUSTOMER_ORDERING_CLOSED";
              throw error;
            }
          }
          '''
          if old not in text:
              raise SystemExit('hasStaffSession block not found')
          text = text.replace(old, new, 1)

          old_create = '''export async function createOrder(order) {
            const supabase = requireSupabase();
          '''
          new_create = '''export async function createOrder(order) {
            assertCustomerOrderingOpen();
            const supabase = requireSupabase();
          '''
          if old_create not in text:
              raise SystemExit('createOrder block not found')
          text = text.replace(old_create, new_create, 1)
          orders_path.write_text(text, encoding='utf-8')

          app_path = Path('src/App.jsx')
          app = app_path.read_text(encoding='utf-8')
          old_catch = '''    } catch (error) {
                console.error("Supabase order create failed:", error);
                window.alert("Commande ma tsajlatch. T2akked mn Supabase w internet.");
                return;
              }
          '''
          new_catch = '''    } catch (error) {
                console.error("Supabase order create failed:", error);
                if (
                  error?.code === "CUSTOMER_ORDERING_CLOSED" ||
                  error?.message === "CUSTOMER_ORDERING_CLOSED"
                ) {
                  window.alert("Commandes fermées de 03:00 à 12:00. Réouverture à 12:00.");
                  return;
                }
                window.alert("Commande ma tsajlatch. T2akked mn Supabase w internet.");
                return;
              }
          '''
          if old_catch not in app:
              raise SystemExit('App order catch block not found')
          app = app.replace(old_catch, new_catch, 1)
          app_path.write_text(app, encoding='utf-8')
          PY

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit final change and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/set-customer-order-hours.yml
          git add src/ordersApi.js src/App.jsx
          git commit -m "Enforce customer ordering hours 12:00-03:00"
          git push origin main
