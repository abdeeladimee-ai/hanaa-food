name: Optimize menu images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick pngquant

      - name: Optimize product images in place
        shell: bash
        run: |
          set -euo pipefail

          optimize_png() {
            file="$1"
            tmp="${file}.tmp.png"
            convert "$file" -auto-orient -strip -resize '1100x1100>' "$tmp"
            if pngquant --force --skip-if-larger --quality=72-88 --speed 1 --output "$file" -- "$tmp"; then
              rm -f "$tmp"
            else
              mv "$tmp" "$file"
            fi
          }

          optimize_jpg() {
            file="$1"
            convert "$file" -auto-orient -strip -resize '1200x1200>' -sampling-factor 4:2:0 -interlace Plane -quality 80 "$file"
          }

          while IFS= read -r -d '' file; do
            bytes=$(stat -c%s "$file")
            if [ "$bytes" -lt 180000 ]; then
              continue
            fi

            case "${file,,}" in
              *.png) optimize_png "$file" ;;
              *.jpg|*.jpeg) optimize_jpg "$file" ;;
            esac
          done < <(find public/products -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0)

          if [ -f public/hanaa-logo.png ] && [ "$(stat -c%s public/hanaa-logo.png)" -ge 180000 ]; then
            tmp='public/hanaa-logo.tmp.png'
            convert public/hanaa-logo.png -auto-orient -strip -resize '800x800>' "$tmp"
            if pngquant --force --skip-if-larger --quality=78-92 --speed 1 --output public/hanaa-logo.png -- "$tmp"; then
              rm -f "$tmp"
            else
              mv "$tmp" public/hanaa-logo.png
            fi
          fi

          echo 'Largest images after optimization:'
          find public/products -type f -printf '%s %p\n' | sort -nr | head -20

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Commit optimized assets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/products public/hanaa-logo.png; then
            echo 'No image changes needed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/products public/hanaa-logo.png
          git commit -m 'Optimize menu images for faster loading'
          git push origin HEAD:main
