name: Add ordering closed banner

on:
  push:
    paths:
      - '.github/workflows/add-ordering-closed-banner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Patch customer closed-hours UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text()

          helper_anchor = '''const phoneIsValid = (value) =>
  /^(0[67]\\d{8}|\\+212[67]\\d{8})$/.test(value.replace(/[ .-]/g, ""));
function feeFor(branch, distance, subtotal) {'''
          helper_replacement = '''const phoneIsValid = (value) =>
  /^(0[67]\\d{8}|\\+212[67]\\d{8})$/.test(value.replace(/[ .-]/g, ""));

const CUSTOMER_ORDER_TIME_ZONE = "Africa/Casablanca";
function customerOrderingIsClosed(now = new Date()) {
  const hourPart = new Intl.DateTimeFormat("en-GB", {
    timeZone: CUSTOMER_ORDER_TIME_ZONE,
    hour: "2-digit",
    hourCycle: "h23",
  })
    .formatToParts(now)
    .find((item) => item.type === "hour");
  const hour = Number(hourPart?.value);
  return Number.isFinite(hour) && hour >= 3 && hour < 12;
}

function feeFor(branch, distance, subtotal) {'''
          if helper_anchor not in text:
              raise SystemExit('helper anchor not found')
          text = text.replace(helper_anchor, helper_replacement, 1)

          state_anchor = '''  const [modal, setModal] = useState(null);
  const [order, setOrder] = useState(null);

  useEffect(() => {
    if (!order?.id) return undefined;'''
          state_replacement = '''  const [modal, setModal] = useState(null);
  const [order, setOrder] = useState(null);
  const [orderingClosed, setOrderingClosed] = useState(customerOrderingIsClosed);

  useEffect(() => {
    const syncOrderingHours = () => setOrderingClosed(customerOrderingIsClosed());
    syncOrderingHours();
    const timer = window.setInterval(syncOrderingHours, 30000);
    return () => window.clearInterval(timer);
  }, []);

  useEffect(() => {
    if (!order?.id) return undefined;'''
          if state_anchor not in text:
              raise SystemExit('state anchor not found')
          text = text.replace(state_anchor, state_replacement, 1)

          header_anchor = '''      </header>
      {view === "home" && ('''
          header_replacement = '''      </header>
      {orderingClosed && (
        <div
          role="status"
          aria-live="polite"
          style={{
            margin: "12px auto 0",
            maxWidth: 1180,
            padding: "14px 18px",
            borderRadius: 16,
            background: "#fff1f1",
            border: "1px solid #f3c5c7",
            color: "#8f151b",
            fontWeight: 800,
            textAlign: "center",
          }}
        >
          Commandes fermées de 03:00 à 12:00 · Réouverture automatique à 12:00
        </div>
      )}
      {view === "home" && ('''
          if header_anchor not in text:
              raise SystemExit('header anchor not found')
          text = text.replace(header_anchor, header_replacement, 1)

          cart_call_anchor = '''          onBack={() => setView("home")}
          onCheckout={() => setView("checkout")}
        />'''
          cart_call_replacement = '''          onBack={() => setView("home")}
          onCheckout={() => setView("checkout")}
          orderingClosed={orderingClosed}
        />'''
          if cart_call_anchor not in text:
              raise SystemExit('cart call anchor not found')
          text = text.replace(cart_call_anchor, cart_call_replacement, 1)

          cart_signature_anchor = '''  change,
  onBack,
  onCheckout,
}) {
  return (
    <main className="simple-page">'''
          cart_signature_replacement = '''  change,
  onBack,
  onCheckout,
  orderingClosed,
}) {
  return (
    <main className="simple-page">'''
          if cart_signature_anchor not in text:
              raise SystemExit('cart signature anchor not found')
          text = text.replace(cart_signature_anchor, cart_signature_replacement, 1)

          button_anchor = '''            <button className="primary-action full" onClick={onCheckout}>
              Commander <span>→</span>
            </button>'''
          button_replacement = '''            <button
              className="primary-action full"
              onClick={onCheckout}
              disabled={orderingClosed}
              title={orderingClosed ? "Réouverture à 12:00" : "Commander"}
            >
              {orderingClosed ? (
                "Commandes fermées · Réouverture à 12:00"
              ) : (
                <>Commander <span>→</span></>
              )}
            </button>'''
          if button_anchor not in text:
              raise SystemExit('button anchor not found')
          text = text.replace(button_anchor, button_replacement, 1)

          path.write_text(text)
          PY

      - name: Verify customer order guard remains
        run: |
          grep -q 'CUSTOMER_ORDERING_CLOSED' src/ordersApi.js
          grep -q 'customerOrderingIsClosed' src/App.jsx
          grep -q 'orderingClosed={orderingClosed}' src/App.jsx
          grep -q 'Réouverture automatique à 12:00' src/App.jsx

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Commit patch and remove one-off workflow
        run: |
          rm .github/workflows/add-ordering-closed-banner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx .github/workflows/add-ordering-closed-banner.yml
          git commit -m 'Show customer closed-hours banner'
          git push
