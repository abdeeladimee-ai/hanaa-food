<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hanaa-logo.png" />
    <link rel="apple-touch-icon" href="/hanaa-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/snack-dashboard.css" />
    <title>hanaa-food</title>
  </head>
  <body>
    <div id="root"></div>

    <script>
      (() => {
        const supportPhones = {
          tadart: "0522501650",
          amgala: "0521431103",
          "rue-baghdad": "0522525204",
        };

        try {
          const key = "hanaa-branches";
          const current = JSON.parse(localStorage.getItem(key) || "[]");
          if (Array.isArray(current) && current.length) {
            const next = current.map((branch) => ({
              ...branch,
              phone: supportPhones[branch.id] || branch.phone || "",
            }));
            localStorage.setItem(key, JSON.stringify(next));
          }
        } catch (_) {}
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
